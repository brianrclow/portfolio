server_tokens off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Tell browsers to always use HTTPS for this domain (and subdomains) going forward
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Restrict where content can load from. Font Awesome is self-hosted (bundled at build time),
    # so no third-party script or font domain is needed for it at all. Google Fonts is inlined
    # into <head> at build time too (needs 'unsafe-inline' in style-src), but still fetches the
    # actual woff2 files from fonts.gstatic.com at runtime.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;

    # Angular SPA routing — send all unmatched routes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed static assets aggressively (Angular appends hashes on build)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
