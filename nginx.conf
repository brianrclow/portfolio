server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Tell browsers to always use HTTPS for this domain (and subdomains) going forward
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Angular SPA routing — send all unmatched routes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed static assets aggressively (Angular appends hashes on build)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
